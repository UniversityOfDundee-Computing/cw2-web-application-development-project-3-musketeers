<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WORLDIn</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/pages/homepage.css" />

    <style>
      .loading-screen {
        position: fixed;
        z-index: 9999;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0d0d2a;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        transition: opacity 1s ease;
      }

      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-top: 20px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
      <h1>Loading Country Data Visualizer...</h1>
      <div class="loading-spinner"></div>
    </div>

    <div
      id="globe-container"
      class="bg-container"
      style="background-image: url('./public/night-sky.png');"
    >
      <canvas id="globe-canvas"></canvas>
    </div>

    <!-- Page Content Over the Globe -->
<main id="content" class="page-overlay">
  <div class="hero-inner text-center text-white">
    <h1 class="display-5 fw-bold">Country Data Visualizer</h1>
    <p class="lead">Explore countries around the world interactively!</p>
    <a href="#explore" class="btn btn-primary btn-lg mt-3">Start Exploring</a>
  </div>
</main>

<section id="explore" class="container page-overlay">
  <div class="card card-bg-transparent position-relative overflow-hidden glow-card">
    <!-- Background glass layer -->
    <div class="card-bg-layer"></div>

    <!-- Foreground content -->
    <div class="card-content position-relative text-center p-4 text-white">
      <h2 class="h5 mb-4">Explore Data Options</h2>
      <div class="d-flex flex-wrap justify-content-center gap-3">
        <a href="/pages/random.html" class="btn btn-outline-light">Random Country</a>
        <a href="/pages/selected.html" class="btn btn-outline-light">Selected Country</a>
        <a href="/pages/world-data.html" class="btn btn-outline-light">World Overview</a>
      </div>
    </div>
  </div>
</section>

    <div id="globe-overlay" style="
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.3);
      z-index: 1;
      pointer-events: none;">
</div>


    <!-- JS to hide loading -->
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const loadingScreen = document.getElementById('loading-screen');
          loadingScreen.style.opacity = '0';
          setTimeout(() => (loadingScreen.style.display = 'none'), 1000);
        }, 1000);
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/pages/homepage/homepage.js"></script>
  </body>
</html>
