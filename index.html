<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldIn</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/pages/homepage.css" />
    <link rel="stylesheet" href="./css/components/loader.css" />
    
    <!-- Using ES modules for Three.js to avoid deprecation warnings -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
    </script>
    <script type="module" src="https://unpkg.com/globe.gl"></script>
  </head>

  <body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
      <h1>WorldIn</h1>
      <p>Interactive Country Explorer</p>
      <div class="loading-spinner"></div>
    </div>

    <div id="loading"></div>
    <div id="tooltip"></div>
    <div id="globe-container" class="bg-container" data-bg-image="./public/night-sky.png">
      <canvas id="globe-canvas"></canvas>
    </div>

    <!-- Page Content Over the Globe -->
    <main id="content" class="page-overlay">
      <div class="hero-inner text-center text-white">
        <h1 class="display-5 fw-bold">WorldIn</h1>
        <p class="lead">Explore countries around the world interactively!</p>
        <button class="btn btn-primary btn-lg mt-3" id="start-exploring">Start Exploring</button>
      </div>
    </main>

    <section id="explore" class="container page-overlay">
      <div class="card card-bg-transparent position-relative overflow-hidden glow-card">
        <!-- Background glass layer -->
        <div class="card-bg-layer"></div>

        <!-- Foreground content -->
        <div class="card-content position-relative text-center p-4 text-white">
          <h2 class="h5 mb-4">Explore Options</h2>
          <div class="d-flex flex-wrap justify-content-center gap-3">
            <a href="./pages/world-data.html" class="btn btn-outline-light">World Overview</a>
            <a href="./pages/random.html" class="btn btn-outline-light">Surprise Me</a>
          </div>
        </div>
      </div>
    </section>

    <div id="globe-overlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Use type="module" to support ES6 import/export syntax -->
    <script type="module" src="js/pages/homepage/homepage.js"></script>
    <script src="js/components/loading.js"></script>
  </body>
</html>
