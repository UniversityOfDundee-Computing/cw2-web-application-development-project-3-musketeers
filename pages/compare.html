<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Data Visualizer - Compare Countries</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/header.css">
    <link rel="stylesheet" href="../css/components/charts.css">
    <link rel="stylesheet" href="../css/pages/compare.css">
    
    <!-- Description for SEO -->
    <meta name="description" content="Compare statistics and information between different countries with interactive visualizations.">
</head>
<body>
    <header>
        <h1>Country Data Visualizer</h1>
        <nav>
            <button id="menu-toggle">☰</button>
            <ul id="nav-links">
                <li><a href="world-data.html">World Data</a></li>
                <li><a href="random.html">Random Country</a></li>
                <li>
                    <select id="countrySelectNav">
                        <option value="">Select a Country</option>
                    </select>
                </li>
                <li><a href="compare.html" class="active">Compare Countries</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <section class="selection-section">
                <div class="country-selectors">
                    <div class="country-selector">
                        <label for="country1">First Country</label>
                        <select id="country1" class="country-select">
                            <option value="">Select a country</option>
                        </select>
                        <div id="country1Details" class="country-preview"></div>
                    </div>

                    <div class="comparison-divider">
                        <span>VS</span>
                    </div>

                    <div class="country-selector">
                        <label for="country2">Second Country</label>
                        <select id="country2" class="country-select">
                            <option value="">Select a country</option>
                        </select>
                        <div id="country2Details" class="country-preview"></div>
                    </div>
                </div>
            </section>

            <section class="comparison-section">
                <div id="generalComparison" class="comparison-chart">
                    <!-- General statistics comparison -->
                </div>
                
                <div class="chart-grid">
                    <div id="populationChart" class="chart-container">
                        <!-- Population comparison -->
                    </div>
                    <div id="areaChart" class="chart-container">
                        <!-- Area comparison -->
                    </div>
                    <div id="languagesChart" class="chart-container">
                        <!-- Languages comparison -->
                    </div>
                    <div id="currenciesChart" class="chart-container">
                        <!-- Currencies comparison -->
                    </div>
                </div>

                <div id="mapComparison" class="comparison-map">
                    <!-- Map visualization -->
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p>Data provided by REST Countries API and visualized using QuickChart API</p>
    </footer>

    <!-- Templates -->
    <template id="country-preview-template">
        <div class="country-preview-content">
            <img src="" alt="" class="preview-flag">
            <div class="preview-info">
                <h3 class="preview-name"></h3>
                <p class="preview-region"></p>
                <p class="preview-population"></p>
            </div>
        </div>
    </template>

    <template id="comparison-stats-template">
        <div class="comparison-stats">
            <table class="comparison-table">
                <thead>
                    <tr>
                        <th>Metric</th>
                        <th class="country1-name"></th>
                        <th class="country2-name"></th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Will be filled dynamically -->
                </tbody>
            </table>
        </div>
    </template>

    <!-- Error template -->
    <template id="error-template">
        <div class="error-message">
            <p></p>
            <button onclick="location.reload()">Retry</button>
        </div>
    </template>

    <!-- Loading template -->
    <template id="loading-template">
        <div class="loading-message">
            <div class="loading-spinner"></div>
            <p>Loading comparison data...</p>
        </div>
    </template>

    <!-- JavaScript Modules -->
    <script type="module" src="../js/pages/compare/index.js"></script>
</body>
</html>
