<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Data Visualizer - Selected Country</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
    rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/header.css">
    <link rel="stylesheet" href="../css/components/charts.css">
    <link rel="stylesheet" href="../css/pages/selected.css">
    
    <!-- Description for SEO -->
    <meta name="description" content="Detailed country information and statistics with interactive visualizations.">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <!-- Left navigation icons (now horizontal) -->
                <div class="navbar-icons">
                    <a href="../index.html" class="icon-btn" id="homeBtn" title="Go to Home">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house-fill" viewBox="0 0 16 16">
                            <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L8 2.207l6.646 6.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293z"/>
                            <path d="m8 3.293 6 6V13.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 13.5V9.293z"/>
                        </svg>
                    </a>
                    <a href="../pages/world-data.html" class="icon-btn" id="globeBtn" title="Go to World Data">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-globe-asia-australia" viewBox="0 0 16 16">
                            <path d="m10.495 6.92 1.278-.619a.483.483 0 0 0 .126-.782c-.252-.244-.682-.139-.932.107-.23.226-.513.373-.816.53l-.102.054c-.338.178-.264.626.1.736a.48.48 0 0 0 .346-.027ZM7.741 9.808V9.78a.413.413 0 1 1 .783.183l-.22.443a.6.6 0 0 1-.12.167l-.193.185a.36.36 0 1 1-.5-.516l.112-.108a.45.45 0 0 0 .138-.326M5.672 12.5l.482.233A.386.386 0 1 0 6.32 12h-.416a.7.7 0 0 1-.419-.139l-.277-.206a.302.302 0 1 0-.298.52z"/>
                            <path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0M1.612 10.867l.756-1.288a1 1 0 0 1 1.545-.225l1.074 1.005a.986.986 0 0 0 1.36-.011l.038-.037a.88.88 0 0 0 .26-.755c-.075-.548.37-1.033.92-1.099.728-.086 1.587-.324 1.728-.957.086-.386-.114-.83-.361-1.2-.207-.312 0-.8.374-.8.123 0 .24-.055.318-.15l.393-.474c.196-.237.491-.368.797-.403.554-.064 1.407-.277 1.583-.973.098-.391-.192-.634-.484-.88-.254-.212-.51-.426-.515-.741a7 7 0 0 1 3.425 7.692 1 1 0 0 0-.087-.063l-.316-.204a1 1 0 0 0-.977-.06l-.169.082a1 1 0 0 1-.741.051l-1.021-.329A1 1 0 0 0 11.205 9h-.165a1 1 0 0 0-.945.674l-.172.499a1 1 0 0 1-.404.514l-.802.518a1 1 0 0 0-.458.84v.455a1 1 0 0 0 1 1h.257a1 1 0 0 1 .542.16l.762.49a1 1 0 0 0 .283.126 7 7 0 0 1-9.49-3.409Z"/>
                        </svg>
                    </a>
                </div>
                
                <!-- Navbar toggler for mobile -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            
                <!-- Navbar links -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <!-- Empty space replacing the center navigation -->
                    <div class="navbar-spacer"></div>
                    
                    <!-- Right-aligned buttons and dropdown -->
                    <ul class="navbar-nav">
                        <!-- Surprise Me button - now links to random page -->
                        <li class="nav-item">
                            <a class="btn btn-primary" href="../pages/random.html">Surprise Me</a>
                        </li>

                        <!-- Country dropdown -->
                        <li class="nav-item ms-2">
                            <div class="dropdown">
                                <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown" id="countryDropdown" aria-expanded="false">
                                    Select Country
                                    <span class="selected-country" id="selectedCountryName"></span>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-chevron-down" viewBox="0 0 16 16">
                                        <path d="M4.293 5.293a1 1 0 0 1 1.414 0L8 7.586l2.293-2.293a1 1 0 0 1 1.414 1.414l-3 3a1 1 0 0 1-1.414 0l-3-3a1 1 0 0 1 0-1.414z"/>
                                    </svg>
                                </button>
                                <ul class="dropdown-menu country-dropdown-menu" id="countrySelectNav" aria-labelledby="countryDropdown">
                                    <li><a class="dropdown-item" href="#">Loading countries...</a></li>
                                </ul>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    
    
    <main class="container">

        <!-- Top Section (map, country overview, quick facts, neighbor countries) -->
        <section class="top-section mb-4">
            <div class="row g-4 align-items-stretch">
                <!-- Left Side: Map + Neighbors -->
                <div class="col-md-8 d-flex flex-column">

                    <div class="map-container flex-grow-1 mb-4" id="mapView">
                      <!-- Map here -->
                    </div>
                    <div class="neighbors-container" id="neighbors">
                      <h2>Neighboring Countries</h2>
                      <div class="neighbors-grid">
                        <!-- Neighbors here -->
                      </div>
                    </div>
                </div>

                <!-- Right Side: Country Overview + Quick Facts -->
                <div class="col-md-4 d-flex flex-column">
                    <div id="countryOverview" class="country-overview mb-4">
                      <!-- Country overview content -->
                    </div>
                    <div id="quickFacts" class="quick-facts">
                      <h2>Quick Facts</h2>
                      <div class="row facts-grid">
                        <!-- Fact items here -->
                      </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- Bottom layout: Charts and Neighbors -->
        <section class="bottom-section mb-4">
            <div class="row g-4">
                <div class="col-md-4">
                    <div id="populationChart" class="chart-container">
                    <!-- Population chart here -->
                    </div>
                </div>
                <div class="col-md-4">
                    <div id="languageChart" class="chart-container">
                    <!-- Language chart here -->
                    </div>
                </div>
                <div class="col-md-4">
                    <div id="areaChart" class="chart-container">
                    <!-- Area chart here -->
                    </div>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p>Data provided by REST Countries API and visualized using QuickChart API</p>
    </footer>

    <!-- Templates -->
    <template id="country-overview-template">

        <div class="country-header">
            <img src="" alt="" class="country-flag">
            <div class="country-info">
                <h2 class="country-name"></h2>
                <div class="country-meta">
                    <p class="capital"></p>
                    <p class="region"></p>
                </div>
            </div>
        </div>

        <div class="country-stats">
            <!-- populated dynamically -->
        </div>
    </template>

    <template id="fact-item-template">
        <div class="fact-item">
            <span class="fact-label"></span>
            <span class="fact-value"></span>
        </div>
    </template>

    <template id="neighbor-template">
        <a href="#" class="neighbor-card">
            <img src="" alt="" class="neighbor-flag">
            <h3 class="neighbor-name"></h3>
        </a>
    </template>

    <!-- Error template -->
    <template id="error-template">
        <div class="error-message">
            <p></p>
            <button onclick="location.reload()">Retry</button>
        </div>
    </template>

    <!-- Loading template -->
    <template id="loading-template">
        <div class="loading-message">
            <div class="loading-spinner"></div>
            <p>Loading data...</p>
        </div>
    </template>

    <!-- JavaScript Modules -->
    <script type="module" src="../js/pages/selected/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>

</body>
</html>
