<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Data Visualizer - Selected Country</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/header.css">
    <link rel="stylesheet" href="../css/components/charts.css">
    <link rel="stylesheet" href="../css/pages/selected.css">
    
    <!-- Description for SEO -->
    <meta name="description" content="Detailed country information and statistics with interactive visualizations.">
</head>
<body>
    <header>
        <h1>Country Data Visualizer</h1>
        <nav>
            <button id="menu-toggle">☰</button>
            <ul id="nav-links">
                <li><a href="world-data.html">World Data</a></li>
                <li><a href="random.html">Random Country</a></li>
                <li>
                    <select id="countrySelectNav">
                        <option value="">Select a Country</option>
                    </select>
                </li>
                <li><a href="compare.html">Compare Countries</a></li>
            </ul>
        </nav>
    </header>

    
    <main>
        <div class="container"></div>
        <!-- Top layout: Map and country info side by side -->
        <section class="top-section">
            <div class="map-container" id="mapView">
              <!-- Map -->
            </div>

            <div class="info-container">
                <div id="countryOverview" class="country-overview">
                  <!-- Country overview content -->
                </div>
                <div id="quickFacts" class="quick-facts">
                  <h2>Quick Facts</h2>
                  <div class="facts-grid"></div>
                </div>
            </div>
        </section>

        <!-- Bottom layout: Charts and Neighbors -->
        <section class="bottom-section">
            <div class="visualizations-section">
              <div id="populationChart" class="chart-container"></div>
              <div id="languageChart" class="chart-container"></div>
              <div id="areaChart" class="chart-container"></div>
            </div>
      
            <div class="neighbors-container" id="neighbors">
              <h2>Neighboring Countries</h2>
              <div class="neighbors-grid"></div>
            </div>
        </section>

        </div>

    </main>
    
    
    
    

    <footer>
        <p>Data provided by REST Countries API and visualized using QuickChart API</p>
    </footer>

    <!-- Templates -->
    <template id="country-overview-template">
        <div class="country-header">
            <img src="" alt="" class="country-flag">
            <div class="country-info">
                <h2 class="country-name"></h2>
                <div class="country-meta">
                    <p class="capital"></p>
                    <p class="region"></p>
                </div>
            </div>
        </div>
        <div class="country-stats">
            <!-- Will be populated dynamically -->
        </div>
    </template>

    <template id="fact-item-template">
        <div class="fact-item">
            <span class="fact-label"></span>
            <span class="fact-value"></span>
        </div>
    </template>

    <template id="neighbor-template">
        <a href="#" class="neighbor-card">
            <img src="" alt="" class="neighbor-flag">
            <h3 class="neighbor-name"></h3>
        </a>
    </template>

    <!-- Error template -->
    <template id="error-template">
        <div class="error-message">
            <p></p>
            <button onclick="location.reload()">Retry</button>
        </div>
    </template>

    <!-- Loading template -->
    <template id="loading-template">
        <div class="loading-message">
            <div class="loading-spinner"></div>
            <p>Loading data...</p>
        </div>
    </template>

    <!-- JavaScript Modules -->
    <script type="module" src="../js/pages/selected/index.js"></script>
</body>
</html>
