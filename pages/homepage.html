<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Country Data Visualizer</title>

  <!-- Bootstrap CSS CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-BTVZ5PHVGv2VVH2gDLFGE3+xUpTr+Y1bHX9H6R0s9sIvm8gTfDwM1GLHyWqT0QoN"
    crossorigin="anonymous"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/pages/homepage.css">
</head>

<body>

  <!-- Globe Background Container -->
  <div id="globeViz"></div>

  <!-- Page Content -->
  <main id="content">
    <div class="hero-inner">
      <h1 class="display-5 fw-bold text-white">Country Data Visualizer</h1>
      <p class="lead text-light">Explore countries around the world interactively!</p>
      <a href="#explore" class="btn btn-primary btn-lg mt-3">Start Exploring</a>
    </div>
  </main>

  <section class="container my-5">
    <div class="card card-bg-transparent position-relative overflow-hidden">
      
      <!-- Background glass layer -->
      <div class="card-bg-layer"></div>
  
      <!-- Foreground content -->
      <div class="card-content position-relative text-center p-4">
        <h2 class="h5 mb-4">Explore Data Options</h2>
        <div class="d-flex flex-wrap justify-content-center gap-3">
          <a href="/pages/random.html" class="btn btn-outline-light">Random Country</a>
          <a href="/pages/selected.html" class="btn btn-outline-light">Selected Country</a>
          <a href="/pages/world-data.html" class="btn btn-outline-light">World Overview</a>
        </div>
      </div>
  
    </div>
  </section>
  

  <!-- JS -->
  <script type="module" src="../js/pages/homepage/homepage.js"></script>

</body>
</html>
